name: Executar Leitor de Apólices

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  run-robot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r Seguros/requirements.txt

      - name: Executar Robô Extrator
        working-directory: ./Seguros
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FOLDER_ENTRADA_ID: ${{ secrets.FOLDER_ENTRADA_ID }}
          FOLDER_PROCESSADOS_ID: ${{ secrets.FOLDER_PROCESSADOS_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python main.py
