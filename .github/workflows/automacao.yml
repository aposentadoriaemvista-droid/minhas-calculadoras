name: Executar Leitor de Apólices

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

# Nunca rodar duas execuções ao mesmo tempo (evita lançamentos duplicados).
# Uma nova execução espera a anterior terminar, em vez de rodar junto.
concurrency:
  group: leitor-apolices
  cancel-in-progress: false

jobs:
  run-robot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r Seguros/requirements.txt

      - name: Executar Robô Extrator
        working-directory: ./Seguros
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FOLDER_ENTRADA_ID: ${{ secrets.FOLDER_ENTRADA_ID }}
          FOLDER_PROCESSADOS_ID: ${{ secrets.FOLDER_PROCESSADOS_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CPF_SALT: ${{ secrets.CPF_SALT }}
        run: |
          python main.py
