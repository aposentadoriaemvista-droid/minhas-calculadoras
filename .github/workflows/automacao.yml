name: Executar Leitor de Apólices

on:
  schedule:
    # Horário em UTC (Brasília = UTC-3): de hora em hora das 8h às 19h em dias úteis,
    # e uma vez ao meio-dia nos fins de semana. Mantém o dashboard da TV sempre atualizado.
    - cron: '0 11-22 * * 1-5'
    - cron: '0 15 * * 0,6'
  workflow_dispatch:

# Nunca rodar duas execuções ao mesmo tempo (evita lançamentos duplicados).
# Uma nova execução espera a anterior terminar, em vez de rodar junto.
concurrency:
  group: leitor-apolices
  cancel-in-progress: false

jobs:
  run-robot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r Seguros/requirements.txt

      - name: Executar Robô Extrator
        working-directory: ./Seguros
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FOLDER_ENTRADA_ID: ${{ secrets.FOLDER_ENTRADA_ID }}
          FOLDER_PROCESSADOS_ID: ${{ secrets.FOLDER_PROCESSADOS_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CPF_SALT: ${{ secrets.CPF_SALT }}
        run: |
          python main.py

      - name: Ler Orçamentos
        if: always()
        working-directory: ./Seguros
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CPF_SALT: ${{ secrets.CPF_SALT }}
        run: |
          python orcamentos.py

      # Roda mesmo se um dos passos anteriores falhar: o painel de renovações nunca fica parado
      - name: Montar Renovações
        if: always()
        working-directory: ./Seguros
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CPF_SALT: ${{ secrets.CPF_SALT }}
        run: |
          python renovacoes.py
